[package]
name = "silt"
version = "0.2.0"
edition = "2021"
description = "Terminal-native Linux storage cleaner: cache cleanup, disk visualization, distro-aware suggestions"
license = "MIT"

[[bin]]
name = "silt"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
walkdir = "2"
sysinfo = "0.33"
humansize = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
lto = true
strip = true
